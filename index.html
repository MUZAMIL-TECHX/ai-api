<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Llama AI — c9muzamil</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">🦙</div>
      <div class="title-wrap">
        <h1>Llama AI Chat</h1>
        <p class="sub">Powered by Qasim Ali 🦋</p>
      </div>
      <button class="clear-btn" id="clearBtn" title="Clear chat">🗑️</button>
    </header>

    <main class="chat" id="chat">
      <div class="msg bot">
        <div class="bubble">Salam! Kuch poocho 👋<br><small>Try: <code>Hello bhai</code></small></div>
      </div>
    </main>

    <form class="composer" id="form">
      <input
        id="input"
        type="text"
        placeholder="Apna sawal likho..."
        autocomplete="off"
        required
      />
      <button type="submit" id="sendBtn">Send ➤</button>
    </form>

    <footer class="footer">
      <span>creator: <b>c9muzamil 😈🇵🇰</b></span>
      <span>Team: <b>RedXhackers</b></span>
      <span>Contact: <b>923130122643</b></span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
